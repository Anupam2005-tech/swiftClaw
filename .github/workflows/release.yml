name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write # 🌟 REQUIRED: Allows OIDC connection to npm without tokens

# 🌟 OPTS INTO NODE 24 RUNTIME: Clears platform deprecation warnings globally
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Sync version and repo name ──────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      repo_lowercase: ${{ steps.v.outputs.repo_lowercase }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "repo_lowercase=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  # ── Publish to npm ──────────────────────────────────────────────────
  npm-publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          # 🌟 FIX: Added --ignore-scripts to stop 'postversion' git push crashes on detached HEAD
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version --ignore-scripts
          bun run build
      - name: Publish to npm using Trusted Publishing
        uses: JS-DevTools/npm-publish@v3
        with:
          provenance: true
          access: public

  # ── Build standalone binaries ───────────────────────────────────────
  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          # 🌟 FIX: Added --ignore-scripts to stop 'postversion' git push crashes on detached HEAD
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version --ignore-scripts
          bun run scripts/compile.ts
          if [ ! -f dist/bin/SHA256SUMS.txt ]; then
            cd dist/bin && sha256sum * > SHA256SUMS.txt || true
          fi
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/bin/

  # ── GitHub Release ──────────────────────────────────────────────────
  release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin/
      - name: Read checksums
        id: checksums
        run: |
          echo "sha256<<EOF" >> "$GITHUB_OUTPUT"
          if [ -f dist/bin/SHA256SUMS.txt ]; then
            cat dist/bin/SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          else
            echo "No checksum file generated." >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: swiftClaw v${{ needs.version.outputs.version }}
          body: |
            ## swiftClaw v${{ needs.version.outputs.version }}

            ### Standalone Binaries
            Download the binary for your platform below.

            | OS | Architecture | Binary |
            |----|-------------|--------|
            | macOS | Apple Silicon | `swiftclaw-macos-arm64` |
            | macOS | Intel | `swiftclaw-macos-x64` |
            | Linux | ARM64 | `swiftclaw-linux-arm64` |
            | Linux | x64 | `swiftclaw-linux-x64` |
            | Windows | x64 | `swiftclaw-windows-x64.exe` |

            ### SHA256 Checksums
            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```

            ### Docker
            ```sh
            docker pull ghcr.io/${{ needs.version.outputs.repo_lowercase }}:v${{ needs.version.outputs.version }}
            ```

            ### npm
            ```sh
            npm install -g swiftclaw
            ```
          files: dist/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker image ────────────────────────────────────────────────────
  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ needs.version.outputs.repo_lowercase }}:v${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.repo_lowercase }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
