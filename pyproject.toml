[project]
name = "swiftclaw-backend"
version = "1.0.0"
description = "SwiftClaw AI assistant — v1 backend (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=48.0.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.136.3",
    "firebase-admin>=7.4.0",
    "google-cloud-secret-manager>=2.29.0",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.6",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.4",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.31",
    "sentry-sdk>=2.62.0",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

